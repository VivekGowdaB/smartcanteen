services:
  - type: web
    name: smart-canteen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py --if-empty && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
