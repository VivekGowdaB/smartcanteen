{% extends "base.html" %}
{% block title %}Bad Request - Smart Canteen{% endblock %}
{% block content %}
<div class="card error-card">
    <div class="card-body text-center">
        <h1 class="error-code">400</h1>
        <h2>Bad Request</h2>
        <p class="text-muted">{{ error or "The request was invalid or could not be completed." }}</p>
        <a href="{{ url_for('student.menu_view') }}" class="btn btn-primary">Return to Menu</a>
    </div>
</div>
{% endblock %}
