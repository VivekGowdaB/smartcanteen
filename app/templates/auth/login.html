{% extends "base.html" %}
{% block title %}Login - Smart Canteen{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header">
            <h3>Login to Your Account</h3>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                <div class="form-group">
                    <label class="form-label" for="identifier">Username or Email</label>
                    <input type="text" id="identifier" name="identifier" class="form-control" placeholder="Enter username or email" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
            </form>
        </div>
        <div class="card-footer text-center" style="font-size: 0.9rem;">
            New to Smart Canteen? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </div>
    </div>

    <div class="card" style="background-color: #f8fafc;">
        <div class="card-body" style="font-size: 0.85rem; color: var(--text-secondary);">
            <strong>Demo Accounts:</strong><br>
            Student: <code>student1</code> / <code>Student@123</code><br>
            Staff: <code>staff</code> / <code>Staff@123</code><br>
            Admin: <code>admin</code> / <code>Admin@123</code>
        </div>
    </div>
</div>
{% endblock %}
