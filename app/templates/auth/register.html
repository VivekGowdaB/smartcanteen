{% extends "base.html" %}
{% block title %}Register - Smart Canteen{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header">
            <h3>Create Student Account</h3>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">College Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@college.edu" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password (min 6 characters)</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Register Account</button>
            </form>
        </div>
        <div class="card-footer text-center" style="font-size: 0.9rem;">
            Already registered? <a href="{{ url_for('auth.login') }}">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
