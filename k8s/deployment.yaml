apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-canteen-deployment
  namespace: smart-canteen
  labels:
    app: smart-canteen
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-canteen
  template:
    metadata:
      labels:
        app: smart-canteen
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: smart-canteen
          image: smartcanteen/smart-canteen:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: smart-canteen-config
            - secretRef:
                name: smart-canteen-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: canteen-data-vol
              mountPath: /app/instance
      volumes:
        - name: canteen-data-vol
          emptyDir: {}
