apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-canteen-ingress
  namespace: smart-canteen
  labels:
    app: smart-canteen
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: canteen.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smart-canteen-service
                port:
                  number: 5000
